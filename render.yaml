services:
  - type: web
    name: brokerhaus
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: BROKERHAUS_DB
        value: /opt/render/project/data/brokerhaus.db
    disk:
      name: brokerhaus-data
      mountPath: /opt/render/project/data
      sizeGB: 1
