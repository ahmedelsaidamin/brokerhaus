{% extends "base.html" %}
{% block title %}Sign in — Brokerhaus{% endblock %}

{% block content %}
<div class="container-narrow" style="max-width:460px;">

  <div class="page-head" style="text-align:center;">
    <div class="page-eyebrow" data-en="Welcome back" data-ar="مرحباً بعودتك">Welcome back</div>
    <h1 class="page-title"
        data-en-html='Sign in to <em>Brokerhaus</em>.'
        data-ar-html='سجّل دخولك في <em>Brokerhaus</em>.'>
      Sign in to <em>Brokerhaus</em>.
    </h1>
  </div>

  <div class="card">
    <form id="login-form" onsubmit="return submitLogin(event)">
      <div class="form-row">
        <label class="form-label-mono" data-en="Email" data-ar="الإيميل">Email</label>
        <input class="form-input" type="email" name="email" required placeholder="name@company.com" autofocus>
      </div>

      <div class="form-row">
        <label class="form-label-mono" data-en="Password" data-ar="كلمة السر">Password</label>
        <input class="form-input" type="password" name="password" required>
      </div>

      <div id="login-error" class="alert alert-danger hidden"></div>

      <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;" id="login-btn">
        <span data-en="Sign in →" data-ar="تسجيل الدخول ←">Sign in →</span>
      </button>

      <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-dim);">
        <span data-en="Don't have an account?" data-ar="مفيش حساب؟">Don't have an account?</span>
        <a href="{{ url_for('signup_page') }}" style="color:var(--accent);text-decoration:none;margin-left:6px;" data-en="Sign up" data-ar="سجّل دلوقتي">Sign up</a>
      </p>
    </form>
  </div>
</div>

<script>
async function submitLogin(e) {
  e.preventDefault();
  const form = document.getElementById('login-form');
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');

  btn.disabled = true;
  err.classList.add('hidden');

  const data = Object.fromEntries(new FormData(form));
  const r = await api('/api/login', { method: 'POST', body: data });

  if (r.ok && r.data && r.data.ok) {
    window.location.href = r.data.redirect;
    return false;
  }
  err.textContent = r.data && r.data.error === 'invalid_credentials'
    ? 'Invalid email or password.'
    : 'Something went wrong. Try again.';
  err.classList.remove('hidden');
  btn.disabled = false;
  return false;
}
</script>

{% endblock %}
