{% extends "base.html" %}
{% block title %}{{ code }} — Brokerhaus{% endblock %}

{% block content %}
<div class="container-narrow" style="text-align:center;padding:80px 24px;">
  <div style="font-family:var(--display);font-size:120px;font-weight:400;letter-spacing:-0.05em;line-height:1;color:var(--accent);margin-bottom:18px;">
    {{ code }}
  </div>
  <h1 class="page-title" style="font-size:32px;">{{ message }}</h1>
  <p class="page-sub" style="margin:0 auto 28px;" data-en="Let's get you back to where you need to be." data-ar="خلينا نرجّعك للمكان اللي محتاجه.">Let's get you back to where you need to be.</p>
  <a href="{{ url_for('landing') }}" class="btn btn-primary" data-en="Back to home →" data-ar="الرئيسية ←">Back to home →</a>
</div>
{% endblock %}
